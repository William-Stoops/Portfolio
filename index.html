<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!--
      Applies the stored theme before first paint (no flash). Mirrors src/hooks/use-theme-preference.ts:
      same storage key, same accepted values. A Content-Security-Policy must allow its hash.
    -->
    <script>
      try {
        var storedTheme = localStorage.getItem('theme-preference');
        if (storedTheme === 'light' || storedTheme === 'dark') {
          document.documentElement.setAttribute('data-theme', storedTheme);
        }
      } catch (error) {}
    </script>
    <title>William Stoops – Software Engineer &amp; AI Engineer</title>
    <meta
      name="description"
      content="William Stoops, Software Engineer & AI Engineer. Full stack TypeScript, Python, C++ et systèmes de calcul : je décide d'une architecture, je la mesure, je la livre."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
