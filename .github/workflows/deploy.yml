name: Deploy

# Publishes main to Cloudflare Pages once CI has passed on it (ADR 0031). Skipped until the
# repository is configured: the CLOUDFLARE_ACCOUNT_ID variable and the CLOUDFLARE_API_TOKEN
# secret, a token limited to "Cloudflare Pages: Edit".
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Pages
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-24.04
    steps:
      # The commit CI has just passed on, not whatever main is by now.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: pages deploy dist --project-name=william-stoops --branch=main --commit-hash=${{ github.event.workflow_run.head_sha }}
